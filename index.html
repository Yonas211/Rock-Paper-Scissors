<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissors">Scissors</button>

    <div id="results"></div>
    <div id="winner"></div>
    <script>
        let round=0;
        const maxRounds=5;
        let computerChoice;
        let humanScore=0, computerScore=0;
        function getComputerChoice() {
            let a = Math.random();
            if(a>=0 && a<1/3) {
                computerChoice="Rock";
            }else if(a>=1/3 && a<2/3) {
                computerChoice="Paper";
            }else {
                computerChoice="Scissors";
            }
        }
        function playRound(humanChoice) {
            round++;
            getComputerChoice();
            if(computerChoice.toLowerCase()=="rock") {
                if(humanChoice.toLowerCase()=="rock") {
                    console.log("DRAW!");
                }else if(humanChoice.toLowerCase()=="paper") {
                    console.log("You Won! Paper beats Rock.");
                    humanScore++;
                }else if(humanChoice.toLowerCase()=="scissors") {
                    console.log("You Lose! Rock beats Scissors.");
                    computerScore++;
                }
            }else if(computerChoice.toLowerCase()=="paper") {
                if(humanChoice.toLowerCase()=="rock") {
                    console.log("You Lose! Paper beats Rock.")
                    computerScore++;
                }else if(humanChoice.toLowerCase()=="paper") {
                    console.log("DRAW!");
                }else if(humanChoice.toLowerCase()=="scissors") {
                    console.log("You Won! Scissors beats Paper.");
                    humanScore++;
                }
            }else if(computerChoice.toLowerCase()=="scissors") {
                if(humanChoice.toLowerCase()=="rock") {
                    console.log("You Won! Rock beats Scissors.");
                    humanScore++;
                }else if(humanChoice.toLowerCase()=="paper") {
                    console.log("You Lose! Scissors beats Paper.");
                    computerScore++;
                }else if(humanChoice.toLowerCase()=="scissors") {
                    console.log("DRAW!");
                }
            }
            resultsDiv.textContent=`Human Score ${humanScore} - ${computerScore} Computer Score `;
            if(round==maxRounds) {
                if(humanScore>computerScore) {
                    winnerDiv.textContent="YOU WON!";
                }else if(humanScore==computerScore) {
                    winnerDiv.textContent="DRAW!";
                }else {
                    winnerDiv.textContent="YOU LOST!";
                }
                rockBtn.disabled=true;
                paperBtn.disabled=true;
                scissorsBtn.disabled=true;
            }
        }
        const rockBtn=document.getElementById("rock");
        const paperBtn=document.getElementById("paper");
        const scissorsBtn=document.getElementById("scissors");
        const resultsDiv=document.getElementById("results");
        const winnerDiv=document.getElementById("winner");
        rockBtn.addEventListener("click", ()=> {
            playRound("rock");
        });
        paperBtn.addEventListener("click", ()=> {
            playRound("paper");
        });
        scissorsBtn.addEventListener("click", ()=> {
            playRound("scissors");
        });
    </script>
</body>
</html>
